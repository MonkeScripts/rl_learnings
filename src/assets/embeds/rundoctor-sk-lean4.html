    headerHtml += '<span>Phase: ' + esc(run.phase || "—") + '</span>';
    headerHtml += '</div>';

    // Boundaries
    if (state.boundaries && state.boundaries.length > 0) {
      headerHtml += '<div class="boundaries-list">Boundaries: ';
      var bParts = [];
      for (var bi = 0; bi < state.boundaries.length; bi++) {
        var b = state.boundaries[bi];
        var changed = b.changed ? Object.keys(b.changed).map(function (k) {
          return k + " " + b.changed[k][0] + " → " + b.changed[k][1];
        }).join(", ") : "";
        bParts.push(b.step + (changed ? " (" + esc(changed) + ")" : ""));
      }
      headerHtml += bParts.join("; ");
      headerHtml += '</div>';
    }
    headerHtml += '</div>';

    var visibleEvents = filterEventsByClock(state.events || [], currentClock);
    // Filter armed entries: only show rules that have not yet armed at the current clock
    var visibleArmed = (state.armed || []).filter(function (a) { return a.at > currentClock; });
    var verdict = state.verdict;
    if (opts._clock != null) {
      verdict = computeVerdict(visibleEvents, visibleArmed);
    }
    var verdictClass = "verdict verdict-" + (verdict.level || "ok");
    var verdictHtml = '<div class="' + verdictClass + '">' + esc(verdict.text) + '</div>';

    var scrubberHtml = "";
    if (mode === "REPLAY" || mode === "replay") {
      scrubberHtml = '<div class="scrubber">';
      scrubberHtml += '<input type="range" min="0" max="' + run.step + '" value="' + currentClock + '" id="rd-scrubber">';
      scrubberHtml += '<span class="scrubber-label">Clock: ' + currentClock + ' / ' + run.step + '</span>';
      scrubberHtml += '</div>';
    }

    var chartsHtml = renderCharts(state, maxStep, currentClock, visibleEvents);
    var feedHtml = renderFeed(visibleEvents, visibleArmed, isStatic);

    app.innerHTML = headerHtml + verdictHtml + scrubberHtml
      + '<div class="main">'
      + '<div class="col-charts">' + chartsHtml + '</div>'
      + '<div class="col-feed">' + feedHtml + '</div>'
      + '</div>';

    // Restore collapsible open state BEFORE measuring SVG widths, so that
    // SVGs inside the collapsible body are visible and have a real clientWidth.
    var collHeaders = app.querySelectorAll(".collapsible-header");
    for (var ci = 0; ci < collHeaders.length; ci++) {
      if (uiCollapsibleOpen) {
        collHeaders[ci].classList.add("open");
        var cb = collHeaders[ci].nextElementSibling;
        if (cb) cb.classList.add("open");
      }
    }

    // Populate SVGs after DOM insertion so we can measure actual width
    populateAllSvgs(state, currentClock, visibleEvents);

    // Remove stale tooltip if any, then create a fresh one
    var oldTt = document.getElementById("rd-tooltip");
    if (oldTt) oldTt.remove();
    var ttEl = document.createElement("div");
    ttEl.className = "tooltip";
    ttEl.style.display = "none";
    ttEl.id = "rd-tooltip";
    document.body.appendChild(ttEl);

    var scrubberEl = document.getElementById("rd-scrubber");
    if (scrubberEl) {
      scrubberEl.addEventListener("input", function () {
        var clock = parseInt(scrubberEl.value, 10);
        savedClock = clock; // Fix 2: persist clock across polls
        var curTt = document.getElementById("rd-tooltip");
        if (curTt) curTt.remove();
        render(state, { static: isStatic, _clock: clock });
      });
    }

    wireChartHover(state, maxStep, currentClock);

    // Wire collapsible header click handlers
    for (var ci2 = 0; ci2 < collHeaders.length; ci2++) {
      (function (hdr) {
        hdr.addEventListener("click", function () {
          hdr.classList.toggle("open");
          var body = hdr.nextElementSibling;
          if (body) body.classList.toggle("open");
          uiCollapsibleOpen = hdr.classList.contains("open");
        });
      })(collHeaders[ci2]);
    }

    var hiddenToggles = app.querySelectorAll(".hidden-toggle");
    for (var hi = 0; hi < hiddenToggles.length; hi++) {
      (function (tog) {
        if (uiHiddenGroupOpen) {
          var g = tog.nextElementSibling;
          if (g) g.classList.add("open");
        }
        tog.addEventListener("click", function () {
          var grp = tog.nextElementSibling;
          if (grp) grp.classList.toggle("open");
          uiHiddenGroupOpen = grp && grp.classList.contains("open");
        });
      })(hiddenToggles[hi]);
    }

    wireEventCardClicks(app);

    // Fix 3: re-apply pinned card highlight
    if (pinnedEventId) {
      var pinnedCard = app.querySelector('.event-card[data-event-id="' + pinnedEventId + '"]');
      if (pinnedCard) pinnedCard.classList.add("highlight");
    }
  }

  function filterEventsByClock(events, clock) {
    return events.filter(function (e) { return e.step_end <= clock; });
  }

  function renderCharts(state, maxStep, clock, visibleEvents) {
    var charts = state.charts || [];
    if (charts.length === 0) return '<p style="color:var(--muted)">No chart data.</p>';

    var primary = [];
    var small = [];
    var rest = [];
    var primaryRoles = { honest: true, reward: true };
    var smallRoles = { std: true, lr: true };

    for (var i = 0; i < charts.length; i++) {
      var c = charts[i];
      if (c.role && primaryRoles[c.role]) {
        primary.push(c);
      } else if (c.role && smallRoles[c.role]) {
        small.push(c);
      } else if (c.tag && c.tag.indexOf("Episode_Termination/") === 0) {
        small.push(c);
      } else {
        rest.push(c);
      }
    }

    var html = "";
    for (var pi = 0; pi < primary.length; pi++) {
      html += renderOneChart(primary[pi], state, maxStep, clock, visibleEvents, "large");
    }
    for (var si = 0; si < small.length; si++) {
      html += renderOneChart(small[si], state, maxStep, clock, visibleEvents, "small");
    }
    if (rest.length > 0) {
      html += '<div class="collapsible-header">Reward terms &amp; metrics (' + rest.length + ')</div>';
      html += '<div class="collapsible-body">';
      for (var ri = 0; ri < rest.length; ri++) {
        html += renderOneChart(rest[ri], state, maxStep, clock, visibleEvents, "small");
      }
      html += '</div>';
    }
    return html;
  }

  function renderOneChart(chart, state, maxStep, clock, visibleEvents, size) {
    var tag = chart.tag;
    var points = chart.points || [];
    var isLog = !!chart.log;

    var filtered = [];
    for (var i = 0; i < points.length; i++) {
      if (points[i][0] <= clock) filtered.push(points[i]);
    }

    var xDomain = [0, maxStep];
    var yDomain = chart.y || [0, 1];
    var svgH = size === "large" ? 160 : 80;

    var chartId = "chart-" + chartContexts.length;
    chartContexts.push({
      id: chartId, tag: tag, points: filtered,
      xDomain: xDomain, yDomain: yDomain, isLog: isLog,
      svgHeight: svgH, chart: chart, svgWidth: 800
    });

    var title = tag;
    if (chart.role) title = chart.role + " (" + tag + ")";

    // Fix 4: emit empty SVG placeholder; content populated after DOM insertion
    var html = '<div class="chart-box ' + size + '" data-chart-idx="' + (chartContexts.length - 1) + '">';
    html += '<div class="chart-title">' + esc(title) + '</div>';
    html += '<svg id="' + chartId + '"></svg>';
    html += '</div>';
    return html;
  }

  // Measure an SVG's effective width.  When the SVG sits inside a hidden
  // container (e.g. collapsed `.collapsible-body`), `svg.clientWidth` is 0.
  // Fall back to the always-visible `.col-charts` column so the viewBox
  // matches the width the SVG will occupy once revealed.
  function measureSvgWidth(svg) {
    if (svg.clientWidth > 0) return svg.clientWidth;
    var col = document.querySelector('.col-charts');
    if (col && col.clientWidth > 0) return col.clientWidth;
    return 800;
  }

  // Populate SVG content after DOM insertion using measured container width
  function populateAllSvgs(state, clock, visibleEvents) {
    var boxes = document.querySelectorAll('.chart-box');
    for (var i = 0; i < boxes.length; i++) {
      var box = boxes[i];
      var idx = parseInt(box.getAttribute('data-chart-idx'), 10);
      var svg = box.querySelector('svg');
      if (!svg) continue;
      var ctx = chartContexts[idx];
      if (!ctx) continue;
      var w = measureSvgWidth(svg);
      var h = ctx.svgHeight;
      ctx.svgWidth = w;
      svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      svg.innerHTML = renderChartSvg(ctx.chart, state, ctx.points, ctx.xDomain,
        ctx.yDomain, ctx.isLog, h, visibleEvents, ctx.tag, w);
    }
  }

  function renderChartSvg(chart, state, points, xDomain, yDomain, isLog, svgHeight, visibleEvents, tag, w) {
    var h = svgHeight;
    var plotL = MARGIN.left;
    var plotR = w - MARGIN.right;
    var plotT = MARGIN.top;
    var plotB = h - MARGIN.bottom;

    var sx = linearScale(xDomain, [plotL, plotR]);
    var sy;
    if (isLog) {
      sy = log10Scale(yDomain, [plotB, plotT]);
    } else {
      sy = linearScale(yDomain, [plotB, plotT]);
    }

    var svg = "";

    var yTicks = computeYTicks(yDomain, Y_TICKS, isLog);
    for (var yi = 0; yi < yTicks.length; yi++) {
      var yy = sy(yTicks[yi]);
      if (yy >= plotT && yy <= plotB) {
        svg += '<line x1="' + plotL + '" y1="' + yy.toFixed(1) + '" x2="' + plotR + '" y2="' + yy.toFixed(1)
          + '" stroke="var(--chart-grid)" stroke-width="0.5" />';
        svg += '<text x="' + (plotL - 4) + '" y="' + (yy + 3).toFixed(1)
          + '" font-size="9" fill="var(--muted)" text-anchor="end">' + fmtTick(yTicks[yi]) + '</text>';
      }
    }

    var boundaries = state.boundaries || [];
    var recoveryWindow = state.recovery_window || 300;
    for (var bi = 0; bi < boundaries.length; bi++) {
      var bx = sx(boundaries[bi].step);
      if (bx >= plotL && bx <= plotR) {
        svg += '<line x1="' + bx.toFixed(1) + '" y1="' + plotT + '" x2="' + bx.toFixed(1) + '" y2="' + plotB
          + '" stroke="var(--muted)" stroke-width="0.5" stroke-dasharray="4 2" />';
        var bandEnd = sx(boundaries[bi].step + recoveryWindow);
        if (bandEnd > plotR) bandEnd = plotR;
        if (bandEnd > bx) {
          svg += '<rect x="' + bx.toFixed(1) + '" y="' + plotT + '" width="' + (bandEnd - bx).toFixed(1)
            + '" height="' + (plotB - plotT) + '" fill="var(--band)" />';
        }
      }
    }

    var pathD = buildPath(points, sx, sy);
    if (pathD) {
      svg += '<path d="' + pathD + '" fill="none" stroke="var(--chart-line)" stroke-width="1.5" />';
    }

    var chartEvents = visibleEvents.filter(function (e) { return e.tag === tag; });
    for (var ei = 0; ei < chartEvents.length; ei++) {
      var ev = chartEvents[ei];
      var evColor = sevColor(ev.severity);
      if (ev.state === "cleared") {
        var tx = sx(ev.step);
        if (tx >= plotL && tx <= plotR) {
          svg += '<line x1="' + tx.toFixed(1) + '" y1="' + (plotB - 4) + '" x2="' + tx.toFixed(1) + '" y2="' + plotB
            + '" stroke="var(--ok)" stroke-width="2" data-event-id="' + esc(ev.id) + '" class="event-marker" />';
        }
      } else if (ev.step === ev.step_end) {
        var nearest = findNearest(points, ev.step);
        if (nearest) {
          var cx = sx(nearest[0]);
          var cy = sy(nearest[1]);
          svg += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="4" fill="' + evColor
            + '" opacity="0.8" data-event-id="' + esc(ev.id) + '" class="event-marker" style="cursor:pointer" />';
        }
      } else {
        var sx1 = sx(ev.step);
        var sx2 = sx(ev.step_end);
        if (sx2 > plotR) sx2 = plotR;
        if (sx1 < plotL) sx1 = plotL;
        svg += '<rect x="' + sx1.toFixed(1) + '" y="' + (plotB + 2) + '" width="' + Math.max(2, sx2 - sx1).toFixed(1)
          + '" height="6" rx="1" fill="' + evColor + '" opacity="0.6" data-event-id="' + esc(ev.id)
          + '" class="event-marker" style="cursor:pointer" />';
      }
    }

    svg += '<line class="crosshair" id="xh-' + chartContexts[chartContexts.length - 1].id
      + '" x1="0" y1="' + plotT + '" x2="0" y2="' + plotB + '" style="display:none" />';

    return svg;
  }

  function computeYTicks(domain, count, isLog) {
    var lo = domain[0], hi = domain[1];
    if (isLog) {
      var lLo = Math.floor(Math.log10(Math.max(lo, 1e-30)));
      var lHi = Math.ceil(Math.log10(Math.max(hi, 1e-30)));
      var ticks = [];
      for (var p = lLo; p <= lHi; p++) ticks.push(Math.pow(10, p));
      if (ticks.length > count + 1) {
        var step = Math.ceil(ticks.length / count);
        var sparse = [];
        for (var s = 0; s < ticks.length; s += step) sparse.push(ticks[s]);
        return sparse;
      }
      return ticks;
    }
    var ticks2 = [];
    var span = hi - lo || 1;
    for (var t = 0; t < count; t++) {
      ticks2.push(lo + (t / (count - 1 || 1)) * span);
    }
    return ticks2;
  }

  function fmtTick(v) {
    var abs = Math.abs(v);
    if (abs === 0) return "0";
    if (abs >= 1e6) return (v / 1e6).toFixed(1) + "M";
    if (abs >= 1e3) return (v / 1e3).toFixed(1) + "k";
    if (abs < 0.01) return v.toExponential(1);
    if (abs < 1) return v.toFixed(3);
    return v.toFixed(1);
  }

  function wireChartHover(state, maxStep, clock) {
    var tooltip = document.getElementById("rd-tooltip");
    if (!tooltip) return;

    var chartBoxes = document.querySelectorAll(".chart-box");
    for (var i = 0; i < chartBoxes.length; i++) {
      (function (box) {
        var idx = parseInt(box.getAttribute("data-chart-idx"), 10);
        var svg = box.querySelector("svg");
        if (!svg) return;

        svg.addEventListener("mousemove", function (e) {
          // Fix 1: skip crosshair while hovering an event marker
          if (hoveringMarker) return;
          var rect = svg.getBoundingClientRect();
          var ctx = chartContexts[idx];
          if (!ctx) return;
          var svgW = ctx.svgWidth || 800;
          var relX = (e.clientX - rect.left) / rect.width * svgW;
          var stepAtMouse = ctx.xDomain[0] + (relX - MARGIN.left) / (svgW - MARGIN.right - MARGIN.left) * (ctx.xDomain[1] - ctx.xDomain[0]);
          if (stepAtMouse < ctx.xDomain[0]) stepAtMouse = ctx.xDomain[0];
          if (stepAtMouse > ctx.xDomain[1]) stepAtMouse = ctx.xDomain[1];
          showCrosshair(Math.round(stepAtMouse), e);
        });

        svg.addEventListener("mouseleave", function () {
          hideCrosshair();
        });

        // Event marker hover
        var markers = svg.querySelectorAll(".event-marker");
        for (var m = 0; m < markers.length; m++) {
          (function (marker) {
            marker.addEventListener("mouseenter", function (e) {
              // Fix 1: set flag so SVG mousemove skips crosshair
              hoveringMarker = true;
              var evId = marker.getAttribute("data-event-id");
              showEventTooltip(evId, state.events || [], e);
            });
            marker.addEventListener("mouseleave", function () {
              hoveringMarker = false;
              hideEventTooltip();
            });
            marker.addEventListener("click", function () {
              var evId = marker.getAttribute("data-event-id");
              pinEvent(evId);
            });
          })(markers[m]);
        }
      })(chartBoxes[i]);
    }
  }

  function showCrosshair(step, mouseEvent) {
    for (var i = 0; i < chartContexts.length; i++) {
      var ctx = chartContexts[i];
      var svgW = ctx.svgWidth || 800;
      var sx = linearScale(ctx.xDomain, [MARGIN.left, svgW - MARGIN.right]);
      var xPos = sx(step);
      var line = document.getElementById("xh-" + ctx.id);
      if (line) {
        line.setAttribute("x1", xPos.toFixed(1));
        line.setAttribute("x2", xPos.toFixed(1));
        line.style.display = "";
      }
    }

    var tooltip = document.getElementById("rd-tooltip");
    if (tooltip) {
      var rows = '<div style="font-weight:600;margin-bottom:2px">Step ' + step + '</div>';
      for (var j = 0; j < chartContexts.length; j++) {
        var ctx2 = chartContexts[j];
        var nearest = findNearest(ctx2.points, step);
        if (nearest) {
          rows += '<div class="tt-row"><span class="tt-tag">' + esc(ctx2.tag) + '</span><span class="tt-val">' + fmt(nearest[1], 3) + '</span></div>';
        }
      }
      tooltip.innerHTML = rows;
      tooltip.style.display = "block";
      tooltip.style.left = (mouseEvent.clientX + 12) + "px";
      tooltip.style.top = (mouseEvent.clientY - 10) + "px";
    }
  }

  function hideCrosshair() {
    for (var i = 0; i < chartContexts.length; i++) {
      var line = document.getElementById("xh-" + chartContexts[i].id);
      if (line) line.style.display = "none";
    }
    var tooltip = document.getElementById("rd-tooltip");
    if (tooltip) tooltip.style.display = "none";
  }

  function showEventTooltip(evId, events, mouseEvent) {
    var ev = null;
    for (var i = 0; i < events.length; i++) {
      if (events[i].id === evId) { ev = events[i]; break; }
    }
    if (!ev) return;
    var tooltip = document.getElementById("rd-tooltip");
    if (!tooltip) return;
    var html = '<div><span class="sev-chip ' + sevClass(ev.severity) + '">' + esc(ev.severity) + '</span> '
      + '<strong>' + esc(ev.rule) + '</strong></div>';
    if (ev.observed) html += '<div style="margin-top:4px">' + esc(ev.observed) + '</div>';
    tooltip.innerHTML = html;
    tooltip.style.display = "block";
    tooltip.style.left = (mouseEvent.clientX + 12) + "px";
    tooltip.style.top = (mouseEvent.clientY - 10) + "px";
  }

  function hideEventTooltip() {
    var tooltip = document.getElementById("rd-tooltip");
    if (tooltip) tooltip.style.display = "none";
  }

  function pinEvent(evId) {
    pinnedEventId = evId;
    var card = document.querySelector('.event-card[data-event-id="' + evId + '"]');
    var prev = document.querySelectorAll(".event-card.highlight");
    for (var i = 0; i < prev.length; i++) prev[i].classList.remove("highlight");
    if (card) {
      card.classList.add("highlight");
      card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  function wireEventCardClicks(app) {
    var cards = app.querySelectorAll(".event-card");
    for (var i = 0; i < cards.length; i++) {
      (function (card) {
        card.addEventListener("click", function () {
          var evId = card.getAttribute("data-event-id");
          if (evId) pinEvent(evId);
        });
      })(cards[i]);
    }
    // Wire hide/note buttons via addEventListener (no inline onclick)
    var hideBtns = app.querySelectorAll(".btn-hide");
    for (var h = 0; h < hideBtns.length; h++) {
      (function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          hideEvent(btn.getAttribute("data-event-id"));
        });
      })(hideBtns[h]);
    }
    var noteBtns = app.querySelectorAll(".btn-note");
    for (var n = 0; n < noteBtns.length; n++) {
      (function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          noteEvent(btn.getAttribute("data-event-id"));
        });
      })(noteBtns[n]);
    }
  }

  function renderFeed(events, armed, isStatic) {
    var open = events.filter(function (e) { return e.state === "open"; });
    var cleared = events.filter(function (e) { return e.state === "cleared"; });
    var hidden = events.filter(function (e) { return e.state === "hidden"; });

    open.sort(function (a, b) { return b.step - a.step; });
    cleared.sort(function (a, b) { return b.step - a.step; });
    hidden.sort(function (a, b) { return b.step - a.step; });

    var html = '';

    if (open.length > 0) {
      html += '<div class="feed-section"><div class="feed-section-title">Open events</div>';
      for (var i = 0; i < open.length; i++) {
        html += renderEventCard(open[i], isStatic);
      }
      html += '</div>';
    }

    if (cleared.length > 0) {
      html += '<div class="feed-section"><div class="feed-section-title">Cleared</div>';
      for (var ci = 0; ci < cleared.length; ci++) {
        var ce = cleared[ci];
        html += '<div class="event-cleared-line"><span class="tick">✓</span>'
          + esc(ce.rule) + ' at ' + ce.step
          + (ce.observed ? ': ' + esc(ce.observed) : '')
          + '</div>';
      }
      html += '</div>';
    }

    if (hidden.length > 0) {
      html += '<div class="feed-section">';
      html += '<div class="hidden-toggle">hidden (' + hidden.length + ')</div>';
      html += '<div class="hidden-group">';
      for (var hi = 0; hi < hidden.length; hi++) {
        html += renderEventCard(hidden[hi], isStatic);
      }
      html += '</div></div>';
    }

    if (armed.length > 0) {
      html += '<div class="feed-section"><div class="feed-section-title">Armed</div>';
      for (var ai = 0; ai < armed.length; ai++) {
        html += '<div class="armed-line">' + esc(armed[ai].rule) + ' arms at ' + armed[ai].at + '</div>';
      }
      html += '</div>';
    }

    if (!html) {
      html = '<p style="color:var(--muted)">No events.</p>';
    }

    return html;
  }

  function renderEventCard(ev, isStatic) {
    var html = '<div class="event-card" data-event-id="' + esc(ev.id) + '">';
    html += '<div><span class="sev-chip ' + sevClass(ev.severity) + '">' + esc(ev.severity) + '</span> ';
    html += '<span class="rule-name">' + esc(ev.rule) + '</span></div>';
    html += '<div class="span-text">step ' + ev.step;
    if (ev.step_end && ev.step_end !== ev.step) html += ' – ' + ev.step_end;
    html += '</div>';

    if (ev.observed) {
      html += '<div class="field"><span class="field-label">observed: </span><span class="field-value">' + esc(ev.observed) + '</span></div>';
    }
    if (ev.likely) {
      html += '<div class="field"><span class="field-label">likely: </span><span class="field-value">' + esc(ev.likely) + '</span></div>';
    }
    if (ev.consider) {
      html += '<div class="field"><span class="field-label">consider: </span><span class="field-value">' + esc(ev.consider) + '</span></div>';
    }
    if (ev.checkpoint) {
      html += '<div class="checkpoint">checkpoint: ' + esc(ev.checkpoint) + '</div>';
    }
    if (ev.note) {
      html += '<div class="field"><span class="field-label">note: </span><span class="field-value">' + esc(ev.note) + '</span></div>';
    }

    if (!isStatic) {
      html += '<div class="actions">';
      if (ev.state !== "hidden") {
        html += '<button class="btn-hide" data-event-id="' + esc(ev.id) + '">hide</button>';
      }
      html += '<button class="btn-note" data-event-id="' + esc(ev.id) + '">note</button>';
      html += '</div>';
    }

    html += '</div>';
    return html;
  }

  function hideEvent(eventId) {
    fetch("/events/" + encodeURIComponent(eventId), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state: "hidden" })
    }).then(function () { poll(); });
  }

  function noteEvent(eventId) {
    var text = prompt("Note:");
    if (text == null) return;
    fetch("/events/" + encodeURIComponent(eventId), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ note: text })
    }).then(function () { poll(); });
  }

  function poll() {
    fetch("/state.json").then(function (r) { return r.json(); }).then(function (data) {
      // Fix 2: preserve scrubber clock across polls
      var o = { static: false };
      if (savedClock != null) o._clock = savedClock;
      render(data, o);
    }).catch(function () {});
  }

  function startPolling(intervalMs) {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(poll, intervalMs);
  }

  function boot() {
    var embedded = document.getElementById("state");
    if (embedded) {
      var data = JSON.parse(embedded.textContent);
      render(data, { static: true });
    } else {
      poll();
      startPolling(5000);
    }
  }

  window.rundoctor = {
    render: render,
    computeVerdict: computeVerdict,
    _hideEvent: hideEvent,
    _noteEvent: noteEvent
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

</script>



</body></html>
